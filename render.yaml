services:
  - type: web
    name: issue-tracker
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: issue-tracker
          property: host
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
